<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tech Interview</title>
     <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <header>
            <p class="logo">TECH INTERVIEW</p>
            <p class="progress">Question 01 / 30</p>
        </header>

        <section class="question-section">

            <p class="category">COMPUTER SCIENCE</p>

            <h1>프로세스와 스레드의<br>차이를 설명해주세요.</h1>

            <textarea
                placeholder="먼저 직접 답변을 작성해보세요."
            ></textarea>

            <button id="check-button">답변 확인</button>


            <section id="result" class="result hidden">

    <p class="result-title">모범 답안</p>

    <p>
        프로세스는 실행 중인 프로그램으로,
        독립적인 메모리 공간을 가지고 실행됩니다.
    </p>

    <p>
        스레드는 프로세스 내부에서 실행되는 단위이며,
        같은 프로세스의 자원을 공유합니다.
    </p>

    <div class="keywords">
        <span>프로세스</span>
        <span>스레드</span>
        <span>독립적인 메모리</span>
        <span>자원 공유</span>
    </div>

</section>

            
        </section>

    </main>
    
    <script src="script.js"></script>

</body>
</html>
